apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/danielfmortensen/fortune-cookie-group1-backend:latest
          ports:
            - containerPort: 9000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: REDIS_DNS
              value: redis
      imagePullSecrets:
        - name: ghcr-secret
